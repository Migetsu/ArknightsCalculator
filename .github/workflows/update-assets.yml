name: Update Optimized Assets

on:
  schedule:
    # Weekly safety net; the workflow also runs after every successful data sync.
    - cron: '0 6 * * 1'
  # New operators and banners arrive with the data sync, so publish their art right
  # after it instead of waiting for the next weekly run.
  workflow_run:
    workflows: ['Update Game Data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-assets
  cancel-in-progress: false

jobs:
  refresh-assets:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Accepted from Secrets or Variables: a fine-grained PAT can live in either
      # place, and the workflow should not silently skip when it is a variable.
      ASSETS_REPO_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN || vars.ASSETS_REPO_TOKEN }}
      GH_TOKEN: ${{ secrets.CRON_PAT }}
    steps:
      - name: Check for the assets repository token
        id: guard
        run: |
          if [ -z "$ASSETS_REPO_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ASSETS_REPO_TOKEN is not configured; skipping asset publication."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci

      # The upstream mirrors carry new operators earlier than our pinned snapshot;
      # refreshing the pins before generation is what makes new avatars/art appear.
      - name: Refresh pinned upstream commits
        if: steps.guard.outputs.enabled == 'true'
        run: npm run data:bump-pins

      - name: Refresh the asset manifest
        if: steps.guard.outputs.enabled == 'true'
        run: |
          # The GitHub tree API occasionally returns 5xx; the committed manifest is a
          # valid fallback, so a refresh failure must not block art publication.
          npm run data:assets || {
            echo "::warning::Asset manifest refresh failed; retrying once."
            sleep 5
            npm run data:assets || echo "::warning::Keeping the committed asset manifest."
          }

      # Art generation is expensive; cache the already generated WebP files so a
      # weekly run only processes operators added since the previous run.
      - name: Cache generated art
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: public/art
          key: optimized-art-${{ hashFiles('data/operators-index.json') }}

      - name: Clone the assets repository
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git clone --depth 1 \
            "https://x-access-token:${ASSETS_REPO_TOKEN}@github.com/Migetsu/arkcalc-assets.git" \
            temp-assets-repo
          # Fail fast with an actionable message instead of after minutes of image
          # generation when the PAT is read-only.
          if ! git -C temp-assets-repo push --dry-run origin HEAD:main >/dev/null 2>&1; then
            echo "::error::ASSETS_REPO_TOKEN cannot push to Migetsu/arkcalc-assets. Grant Contents: Read and write to the token."
            exit 1
          fi

      - name: Generate operator thumbs and hero art
        if: steps.guard.outputs.enabled == 'true'
        run: npm run data:thumbs

      - name: Generate banner thumbnails
        if: steps.guard.outputs.enabled == 'true'
        run: npm run data:banner-thumbs

      # `hasArt` comes from data/banner-arts.json. Recompute just those flags instead
      # of rebuilding the dataset, which would need the raw game tables.
      - name: Refresh banner art flags
        if: steps.guard.outputs.enabled == 'true'
        run: npm run data:apply-banner-art

      - name: Copy generated art into the assets repository
        if: steps.guard.outputs.enabled == 'true'
        run: |
          mkdir -p temp-assets-repo/thumbs temp-assets-repo/hero
          # Only publish files that are missing: the assets repository already holds
          # the existing set, and re-encoding it would rewrite hundreds of binaries
          # on every run. A forced refresh is a manual operation.
          for file in public/art/thumbs/*.webp; do
            [ -e "$file" ] || continue
            target="temp-assets-repo/thumbs/$(basename "$file")"
            [ -e "$target" ] || cp "$file" "$target"
          done
          for file in public/art/hero/*.webp; do
            [ -e "$file" ] || continue
            target="temp-assets-repo/hero/$(basename "$file")"
            [ -e "$target" ] || cp "$file" "$target"
          done

      - name: Commit and push the assets repository
        if: steps.guard.outputs.enabled == 'true'
        id: publish
        working-directory: temp-assets-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No asset changes to publish."
          else
            git commit -m "chore: refresh optimized assets"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Published $(git rev-parse --short HEAD)"
          fi

      - name: Wait for jsDelivr to serve the refreshed commits
        if: steps.guard.outputs.enabled == 'true'
        run: |
          GAME_SHA=$(sed -n "s/.*ASSET_REPO_COMMIT = '\([0-9a-f]*\)'.*/\1/p" shared/utils/resolveAsset.ts)
          ASSETS_SHA="${{ steps.publish.outputs.sha }}"

          warm() {
            local attempt=1
            while [ "$attempt" -le 30 ]; do
              local code
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1" || true)
              [ "$code" = "200" ] && return 0
              attempt=$((attempt + 1))
              sleep 10
            done
            return 1
          }

          if [ -n "$GAME_SHA" ]; then
            warm "https://cdn.jsdelivr.net/gh/yuanyan3060/ArknightsGameResource@${GAME_SHA}/avatar/char_003_kalts.png" \
              || echo "::warning::jsDelivr is not serving the refreshed game-data commit yet."
          fi

          if [ -n "$ASSETS_SHA" ]; then
            for file in $(git -C temp-assets-repo ls-files thumbs hero banners | shuf -n 5); do
              warm "https://cdn.jsdelivr.net/gh/Migetsu/arkcalc-assets@${ASSETS_SHA}/${file}" \
                || echo "::warning::jsDelivr is not serving ${file} from ${ASSETS_SHA} yet."
            done
          fi

      - name: Commit refreshed pins and open a PR
        if: steps.guard.outputs.enabled == 'true'
        id: pr
        env:
          ASSETS_SHA: ${{ steps.publish.outputs.sha }}
          ASSETS_CHANGED: ${{ steps.publish.outputs.changed }}
          BRANCH: chore/refresh-assets-${{ github.run_id }}
        run: |
          if [ "$ASSETS_CHANGED" = "true" ] && [ -n "$ASSETS_SHA" ]; then
            sed -i "s/export const OPTIMIZED_ASSETS_COMMIT = '[0-9a-f]*'/export const OPTIMIZED_ASSETS_COMMIT = '${ASSETS_SHA}'/" shared/utils/resolveAsset.ts
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add shared/utils/resolveAsset.ts data/
          if git diff --cached --quiet; then
            echo "No pin or data changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh assets and pins"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: refresh assets and pins" \
            --body "Automated asset refresh: upstream pins, the asset manifest and banner art flags were updated.${ASSETS_SHA:+ Published optimized assets at ${ASSETS_SHA}.} Merged only after green CI."
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Wait for CI and merge the asset refresh
        if: steps.guard.outputs.enabled == 'true' && steps.pr.outputs.branch != ''
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "::warning::No pull request found for $BRANCH; leaving it for manual review."
            exit 0
          fi
          # A broken pin must not reach production: wait for CI, otherwise leave the
          # PR open for a human/agent to fix.
          if timeout 1500 gh pr checks "$PR" --watch --interval 30; then
            gh pr merge "$PR" --squash --delete-branch
          else
            echo "::warning::CI is not green for PR #$PR; leaving it open."
          fi

      - name: Remove the temporary assets clone
        if: always()
        run: rm -rf temp-assets-repo
