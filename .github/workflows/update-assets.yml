name: Update Optimized Assets

on:
  schedule:
    # Weekly, after the Monday data sync so new operators/banners are included.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-assets
  cancel-in-progress: false

jobs:
  refresh-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Accepted from Secrets or Variables: a fine-grained PAT can live in either
      # place, and the workflow should not silently skip when it is a variable.
      ASSETS_REPO_TOKEN: ${{ secrets.ASSETS_REPO_TOKEN || vars.ASSETS_REPO_TOKEN }}
      GH_TOKEN: ${{ secrets.CRON_PAT }}
    steps:
      - name: Check for the assets repository token
        id: guard
        run: |
          if [ -z "$ASSETS_REPO_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ASSETS_REPO_TOKEN is not configured; skipping asset publication."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci

      # Art generation is expensive; cache the already generated WebP files so a
      # weekly run only processes operators added since the previous run.
      - name: Cache generated art
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: public/art
          key: optimized-art-${{ hashFiles('data/operators-index.json') }}

      - name: Clone the assets repository
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git clone --depth 1 \
            "https://x-access-token:${ASSETS_REPO_TOKEN}@github.com/Migetsu/arkcalc-assets.git" \
            temp-assets-repo
          # Fail fast with an actionable message instead of after minutes of image
          # generation when the PAT is read-only.
          if ! git -C temp-assets-repo push --dry-run origin HEAD:main >/dev/null 2>&1; then
            echo "::error::ASSETS_REPO_TOKEN cannot push to Migetsu/arkcalc-assets. Grant Contents: Read and write to the token."
            exit 1
          fi

      - name: Generate operator thumbs and hero art
        if: steps.guard.outputs.enabled == 'true'
        run: npm run data:thumbs

      - name: Generate banner thumbnails
        if: steps.guard.outputs.enabled == 'true'
        run: npm run data:banner-thumbs

      - name: Copy generated art into the assets repository
        if: steps.guard.outputs.enabled == 'true'
        run: |
          mkdir -p temp-assets-repo/thumbs temp-assets-repo/hero
          # Only publish files that are missing: the assets repository already holds
          # the existing set, and re-encoding it would rewrite hundreds of binaries
          # on every run. A forced refresh is a manual operation.
          for file in public/art/thumbs/*.webp; do
            [ -e "$file" ] || continue
            target="temp-assets-repo/thumbs/$(basename "$file")"
            [ -e "$target" ] || cp "$file" "$target"
          done
          for file in public/art/hero/*.webp; do
            [ -e "$file" ] || continue
            target="temp-assets-repo/hero/$(basename "$file")"
            [ -e "$target" ] || cp "$file" "$target"
          done

      - name: Commit and push the assets repository
        if: steps.guard.outputs.enabled == 'true'
        id: publish
        working-directory: temp-assets-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No asset changes to publish."
          else
            git commit -m "chore: refresh optimized assets"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Published $(git rev-parse --short HEAD)"
          fi

      - name: Pin the new assets commit and open a PR
        if: steps.guard.outputs.enabled == 'true' && steps.publish.outputs.changed == 'true'
        id: pr
        env:
          ASSETS_SHA: ${{ steps.publish.outputs.sha }}
          BRANCH: chore/refresh-assets-${{ github.run_id }}
        run: |
          sed -i "s/export const OPTIMIZED_ASSETS_COMMIT = '[0-9a-f]*'/export const OPTIMIZED_ASSETS_COMMIT = '${ASSETS_SHA}'/" shared/utils/resolveAsset.ts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add shared/utils/resolveAsset.ts data/banner-arts.json
          git commit -m "chore: publish optimized assets ${ASSETS_SHA:0:7}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: publish optimized assets ${ASSETS_SHA:0:7}" \
            --body "Automated asset publication. Generated operator thumbs/hero art and banner thumbnails were pushed to \`Migetsu/arkcalc-assets\` at \`${ASSETS_SHA}\`; this PR pins that commit in \`OPTIMIZED_ASSETS_COMMIT\` and records the new banner art list. Merged only after green CI."
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Wait for CI and merge the pin bump
        if: steps.guard.outputs.enabled == 'true' && steps.publish.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$PR" ]; then
            echo "::warning::No pull request found for $BRANCH; leaving it for manual review."
            exit 0
          fi
          # A broken pin must not reach production: wait for CI, otherwise leave the
          # PR open for a human/agent to fix.
          if timeout 1500 gh pr checks "$PR" --watch --interval 30; then
            gh pr merge "$PR" --squash --delete-branch
          else
            echo "::warning::CI is not green for PR #$PR; leaving it open."
          fi

      - name: Remove the temporary assets clone
        if: always()
        run: rm -rf temp-assets-repo
