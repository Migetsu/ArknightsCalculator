name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 3 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping user_data REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NUXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || secrets.NUXT_PUBLIC_SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Skipping ping: Supabase credentials not found in secrets."
            exit 0
          fi
          echo "Pinging Supabase REST endpoint..."
          curl -s -f -o /dev/null -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/user_data?select=count"
          echo "Ping successful!"
