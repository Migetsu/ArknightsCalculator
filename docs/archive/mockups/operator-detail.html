<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>C: Ember Editorial</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Golos+Text:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
      }
      a:hover {
        color: #ffd9a8 !important;
      }
    </style>
  </head>
  <body>
    <div
      style="
        width: 100%;
        min-height: 820px;
        box-sizing: border-box;
        background: #120d0b;
        color: #f4ece6;
        font-family: 'Golos Text', sans-serif;
      "
    >
      <section
        style="
          position: relative;
          height: 420px;
          overflow: hidden;
          background: radial-gradient(ellipse at 72% 40%, #ff6a3d 0%, #7a2a14 38%, #120d0b 78%);
        "
      >
        <header
          style="
            position: relative;
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 24px 48px;
            font:
              600 14px 'Golos Text',
              sans-serif;
          "
        >
          <b
            style="
              font:
                800 16px Unbounded,
                sans-serif;
              letter-spacing: 0.06em;
            "
            >ARKCALC</b
          >
          <a href="#" style="color: #ffd9a8; text-decoration: none">Operators</a
          ><a href="#" style="color: #f4ece6; text-decoration: none">Planner</a
          ><a href="#" style="color: #f4ece6; text-decoration: none">Depot</a
          ><a href="#" style="color: #f4ece6; text-decoration: none">Gacha</a>
          <a href="#" style="margin-left: auto; color: #d9c7bb; text-decoration: none">Settings</a>
        </header>
        <svg
          viewBox="0 0 200 300"
          height="520"
          style="position: absolute; right: 140px; top: 60px; opacity: 0.55"
          aria-hidden="true"
        >
          <circle cx="100" cy="70" r="46" fill="#120d0b" />
          <path d="M20 300 C20 170 60 130 100 130 C140 130 180 170 180 300Z" fill="#120d0b" />
        </svg>
        <p
          style="
            position: absolute;
            right: 48px;
            top: 92px;
            margin: 0;
            font: 500 11px monospace;
            letter-spacing: 0.2em;
            color: #ffd9a8;
          "
        >
          [ OPERATOR ART, ELITE 2 ]
        </p>
        <div style="position: absolute; left: 48px; bottom: 84px">
          <p
            style="
              margin: 0 0 10px;
              font:
                600 13px 'Golos Text',
                sans-serif;
              letter-spacing: 0.18em;
              color: #ffd9a8;
            "
          >
            6★ GUARD / LORD / KARLAN TRADE
          </p>
          <h1
            style="
              margin: 0;
              font:
                800 92px/0.95 Unbounded,
                sans-serif;
              letter-spacing: -0.02em;
            "
          >
            SilverAsh
          </h1>
        </div>
      </section>
      <section
        style="
          position: relative;
          margin: -56px 48px 0;
          padding: 24px 32px;
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 24px;
          background: #1b1411;
          border: 1px solid rgba(255, 217, 168, 0.14);
          border-radius: 6px;
        "
      >
        <div>
          <span
            style="
              font:
                600 12px 'Golos Text',
                sans-serif;
              letter-spacing: 0.14em;
              color: #b9a595;
            "
            >HP</span
          >
          <div
            style="
              font:
                800 44px Unbounded,
                sans-serif;
            "
          >
            2890
          </div>
        </div>
        <div>
          <span
            style="
              font:
                600 12px 'Golos Text',
                sans-serif;
              letter-spacing: 0.14em;
              color: #b9a595;
            "
            >ATK</span
          >
          <div
            style="
              font:
                800 44px Unbounded,
                sans-serif;
              color: #ff8a5c;
            "
          >
            859
          </div>
        </div>
        <div>
          <span
            style="
              font:
                600 12px 'Golos Text',
                sans-serif;
              letter-spacing: 0.14em;
              color: #b9a595;
            "
            >DEF</span
          >
          <div
            style="
              font:
                800 44px Unbounded,
                sans-serif;
            "
          >
            447
          </div>
        </div>
        <div>
          <span
            style="
              font:
                600 12px 'Golos Text',
                sans-serif;
              letter-spacing: 0.14em;
              color: #b9a595;
            "
            >RES</span
          >
          <div
            style="
              font:
                800 44px Unbounded,
                sans-serif;
            "
          >
            10
          </div>
        </div>
      </section>
      <nav
        style="
          display: flex;
          gap: 32px;
          margin: 32px 48px 0;
          border-bottom: 1px solid rgba(255, 217, 168, 0.14);
          font:
            600 15px 'Golos Text',
            sans-serif;
        "
      >
        <button
          style="
            background: none;
            border: 0;
            border-bottom: 3px solid #ff6a3d;
            padding: 0 0 14px;
            color: #f4ece6;
            font: inherit;
            cursor: pointer;
          "
        >
          Stats
        </button>
        <button
          style="
            background: none;
            border: 0;
            padding: 0 0 14px;
            color: #b9a595;
            font: inherit;
            cursor: pointer;
          "
        >
          Skills
        </button>
        <button
          style="
            background: none;
            border: 0;
            padding: 0 0 14px;
            color: #b9a595;
            font: inherit;
            cursor: pointer;
          "
        >
          Talents
        </button>
        <button
          style="
            background: none;
            border: 0;
            padding: 0 0 14px;
            color: #b9a595;
            font: inherit;
            cursor: pointer;
          "
        >
          Modules
        </button>
      </nav>
      <section
        style="
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 24px;
          margin: 28px 48px 40px;
          font:
            600 13px 'Golos Text',
            sans-serif;
        "
      >
        <label style="display: block; padding: 18px; background: #1b1411; border-radius: 6px"
          >Level 90<input
            type="range"
            min="1"
            max="90"
            value="90"
            style="width: 100%; margin-top: 10px; accent-color: #ff6a3d"
        /></label>
        <label style="display: block; padding: 18px; background: #1b1411; border-radius: 6px"
          >Trust 100%<input
            type="range"
            min="0"
            max="100"
            value="100"
            style="width: 100%; margin-top: 10px; accent-color: #ff6a3d"
        /></label>
        <label style="display: block; padding: 18px; background: #1b1411; border-radius: 6px"
          >Potential 6<input
            type="range"
            min="1"
            max="6"
            value="6"
            style="width: 100%; margin-top: 10px; accent-color: #ff6a3d"
        /></label>
      </section>
    </div>
  </body>
</html>
