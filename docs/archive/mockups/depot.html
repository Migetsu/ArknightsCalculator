<!doctype html>

    <title>C: Depot</title>

    <link

    />
    <style>
      body {
        margin: 0;
      }
      nav a {
        color: #a8978a;
        text-decoration: none;
      }
      nav a:hover {
        color: #ffd9a8;
      }
      header {
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 22px 48px;
        font:
          600 14px 'Golos Text',
          sans-serif;
        border-bottom: 1px solid rgba(232, 221, 211, 0.1);
      }
      nav {
        display: flex;
        gap: 24px;
      }
      .pn {
        background: #17110f;
        border: 1px solid rgba(232, 221, 211, 0.08);
      }
      .it {
        width: 56px;
        height: 56px;
        border: 1px solid #6fa3e0;
        background: #0e0a09;

        align-items: center;
        justify-content: center;
        font:
          600 11px 'Golos Text',

        color: #a8978a;
      }
      .t {
        margin: 0;
        font:

          sans-serif;
      }
      h2 {
        margin: 0 0 14px;
        font:
          800 15px Unbounded,
          sans-serif;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 14px 8px;
        font:
          400 12px 'Golos Text',
          sans-serif;
        color: #a8978a;
      }
      .cell input {
        width: 64px;
        padding: 6px;
        text-align: center;
        background: #0e0a09;
        border: 1px solid rgba(232, 221, 211, 0.15);
        color: #e8ddd3;
        font:
          600 14px 'Golos Text',
          sans-serif;
      }

      input[type='number']::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type='number'] {
        -moz-appearance: textfield;
      }
      .st {
        display: inline-flex;
        align-items: stretch;
        border: 1px solid rgba(232, 221, 211, 0.2);
        background: #0e0a09;
      }
      .st button {
        width: 28px;
        border: 0;
        background: #1d1511;
        color: #ffd9a8;
        font:
          600 16px 'Golos Text',
          sans-serif;
        cursor: pointer;
        padding: 0;
      }
      .st button:hover {
        background: #ff6a3d;
        color: #120d0b;
      }
      .st button:focus-visible {
        outline: 2px solid #ffd9a8;
        outline-offset: -2px;
      }
      .st input {
        width: 56px !important;
        min-width: 0;
        margin: 0 !important;
        border: 0 !important;
        border-left: 1px solid rgba(232, 221, 211, 0.12) !important;
        border-right: 1px solid rgba(232, 221, 211, 0.12) !important;
        padding: 7px 0 !important;
        text-align: center;
        background: transparent !important;
        color: #e8ddd3;
        font:
          600 14px 'Golos Text',
          sans-serif !important;

        font-family: 'Golos Text', sans-serif;

            gap: 14px;

            font:

                background: #ff6a3d;
                border: 0;
                color: #120d0b;
                font:
                  600 12px 'Golos Text',

                    width: 120px;
                    background: #0e0a09;
                    border: 1px solid rgba(232, 221, 211, 0.15);
